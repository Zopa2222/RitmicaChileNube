steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/ritmica/ritmica-backend:$COMMIT_SHA
      - backend
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/ritmica/ritmica-backend:$COMMIT_SHA
  - name: node:20-alpine
    entrypoint: sh
    args:
      - -c
      - npm ci && npm run build
  - name: gcr.io/cloud-builders/gsutil
    args:
      - -m
      - rsync
      - -d
      - -r
      - dist/gymnastics-scoring/browser
      - gs://${_STATIC_BUCKET}
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/ritmica/ritmica-backend:$COMMIT_SHA
