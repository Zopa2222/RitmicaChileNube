<main class="export-page">
    <a mat-button [routerLink]="['/championships', championshipId, 'operations']">
        <mat-icon>arrow_back</mat-icon>
        Operación
    </a>

    <section>
        <mat-icon>download</mat-icon>
        <h1>Exportar resultados</h1>
        <p>Los documentos se generan desde el cálculo autoritativo de PostgreSQL y se resguardan en el almacenamiento privado.</p>
        <div>
            <button mat-flat-button color="primary" type="button" (click)="download('excel')" [disabled]="downloading">
                <mat-icon>table_view</mat-icon>
                Exportar Excel
            </button>
            <button mat-stroked-button type="button" (click)="download('pdf')" [disabled]="downloading">
                <mat-icon>picture_as_pdf</mat-icon>
                Exportar PDF
            </button>
        </div>
        <p *ngIf="message">{{ message }}</p>
    </section>
</main>
